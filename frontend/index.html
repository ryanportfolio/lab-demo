<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Experiments, a working build for Prediction Lab</title>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var stored = q.get('theme') || localStorage.getItem('plab-demo-theme');
          // Four concrete themes: light, dark, night, gold. A first visit (or
          // a legacy stored "system") resolves the OS preference once, then
          // the toggle owns it.
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'night' || stored === 'gold'
              ? stored
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.add(theme);
          document.documentElement.dataset.themePref = theme;
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
