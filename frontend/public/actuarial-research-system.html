  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;ars-poster&quot;&gt;
  &lt;style&gt;
    html,
    body {
      height: 100%;
      overflow: hidden !important;
    }

    body {
      padding: 0 !important;
    }

    #ars-poster {
      --ars-dark: color-mix(in oklab, var(--foreground) 92%, var(--purple));
      --ars-light: var(--background);
      --ars-ink: var(--foreground);
      --ars-mint: var(--green);
      --ars-pink: var(--viz-series-4);
      --ars-acid: var(--yellow);
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-rows: minmax(116px, 15vh) minmax(0, 1fr) minmax(158px, 23vh);
      color: var(--ars-ink);
      background:
        linear-gradient(color-mix(in srgb, var(--ars-ink) 5%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--ars-ink) 5%, transparent) 1px, transparent 1px),
        var(--ars-light);
      background-size: 24px 24px;
      font-size: clamp(15px, 1.7vh, 18px);
      font-weight: 400;
    }

    #ars-poster * {
      box-sizing: border-box;
    }

    #ars-poster h1,
    #ars-poster h2,
    #ars-poster h3,
    #ars-poster p,
    #ars-poster ul {
      margin-top: 0;
    }

    #ars-poster h1,
    #ars-poster h2,
    #ars-poster h3,
    #ars-poster strong {
      font-weight: 500;
    }

    #ars-poster .ars-mono,
    #ars-poster .ars-kicker,
    #ars-poster .ars-label,
    #ars-poster .ars-pass,
    #ars-poster .ars-output-label,
    #ars-poster .ars-spine-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #ars-poster .ars-top {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(300px, 0.72fr);
      gap: 3vw;
      align-items: center;
      padding: 18px clamp(22px, 3.4vw, 64px) 16px;
      border-bottom: 1px solid color-mix(in srgb, var(--ars-ink) 15%, transparent);
    }

    #ars-poster .ars-top::before {
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: linear-gradient(90deg, var(--ars-mint) 0 60%, var(--ars-pink) 60% 79%, var(--ars-acid) 79% 100%);
      content: &quot;&quot;;
    }

    #ars-poster .ars-kicker {
      margin-bottom: 6px;
      color: var(--muted-foreground);
    }

    #ars-poster .ars-title {
      max-width: 1000px;
      margin-bottom: 0;
      font-size: calc(var(--font-size-base) * 3.2);
      line-height: 0.93;
      letter-spacing: -0.045em;
    }

    #ars-poster .ars-title span {
      color: var(--ars-mint);
    }

    #ars-poster .ars-thesis {
      align-self: stretch;
      display: grid;
      align-content: center;
      padding-left: 22px;
      border-left: 1px solid color-mix(in srgb, var(--ars-ink) 20%, transparent);
    }

    #ars-poster .ars-thesis .ars-label {
      margin-bottom: 7px;
      color: var(--ars-pink);
    }

    #ars-poster .ars-thesis p {
      max-width: 430px;
      margin-bottom: 0;
      line-height: 1.4;
    }

    #ars-poster .ars-pipeline {
      position: relative;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      color: var(--ars-light);
      background:
        radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ars-light) 15%, transparent) 1px, transparent 1.5px),
        var(--ars-dark);
      background-size: 24px 24px;
      border-bottom: 7px solid var(--ars-mint);
    }

    #ars-poster .ars-stage {
      --stage-accent: var(--ars-mint);
      position: relative;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(82px, 14vh) minmax(0, 1fr) auto;
      padding: clamp(18px, 2.4vh, 28px) clamp(20px, 2.3vw, 42px) clamp(15px, 2vh, 24px);
      border-right: 1px solid color-mix(in srgb, var(--ars-light) 18%, transparent);
    }

    #ars-poster .ars-stage:nth-child(2) {
      --stage-accent: var(--ars-pink);
    }

    #ars-poster .ars-stage:nth-child(3) {
      --stage-accent: var(--ars-acid);
      border-right: 0;
    }

    #ars-poster .ars-stage::before {
      position: absolute;
      inset: 0 auto auto 0;
      width: 38%;
      height: 4px;
      background: var(--stage-accent);
      content: &quot;&quot;;
    }

    #ars-poster .ars-stage-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    #ars-poster .ars-pass {
      color: var(--stage-accent);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    #ars-poster .ars-stage h2 {
      margin-bottom: 3px;
      color: var(--ars-light);
      font-size: calc(var(--font-size-base) * 1.8);
      line-height: 1;
      letter-spacing: -0.025em;
    }

    #ars-poster .ars-stage-sub {
      margin-bottom: 0;
      color: color-mix(in srgb, var(--ars-light) 62%, transparent);
    }

    #ars-poster .ars-schematic {
      width: 100%;
      height: 100%;
      min-height: 72px;
      color: var(--stage-accent);
    }

    #ars-poster .ars-schematic .ars-faint {
      color: color-mix(in srgb, var(--ars-light) 30%, transparent);
    }

    #ars-poster .ars-copy {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(120px, 0.75fr);
      gap: clamp(14px, 1.7vw, 28px);
      padding-top: 12px;
      border-top: 1px solid color-mix(in srgb, var(--ars-light) 16%, transparent);
    }

    #ars-poster .ars-label {
      margin-bottom: 8px;
      color: var(--stage-accent);
    }

    #ars-poster .ars-list {
      margin-bottom: 0;
      padding-left: 16px;
      line-height: 1.34;
    }

    #ars-poster .ars-list li + li {
      margin-top: 7px;
    }

    #ars-poster .ars-why {
      padding-left: 14px;
      border-left: 1px solid color-mix(in srgb, var(--ars-light) 22%, transparent);
      line-height: 1.34;
    }

    #ars-poster .ars-why p {
      margin-bottom: 0;
    }

    #ars-poster .ars-output {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      padding-top: 11px;
      border-top: 1px solid color-mix(in srgb, var(--ars-light) 16%, transparent);
    }

    #ars-poster .ars-output i {
      color: var(--stage-accent);
    }

    #ars-poster .ars-output-label {
      color: var(--stage-accent);
    }

    #ars-poster .ars-output p {
      margin-bottom: 0;
      color: color-mix(in srgb, var(--ars-light) 68%, transparent);
    }

    #ars-poster .ars-bottom {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.62fr);
      gap: clamp(24px, 3vw, 54px);
      align-items: center;
      padding: 16px clamp(22px, 3.4vw, 64px);
    }

    #ars-poster .ars-spine-label {
      margin-bottom: 9px;
      color: var(--muted-foreground);
    }

    #ars-poster .ars-spine {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    #ars-poster .ars-node {
      min-width: 0;
      padding: 8px 4px 7px;
      border-top: 3px solid var(--node-accent, var(--ars-mint));
      background: color-mix(in srgb, var(--ars-light) 88%, transparent);
    }

    #ars-poster .ars-node:nth-of-type(3) { --node-accent: var(--ars-pink); }
    #ars-poster .ars-node:nth-of-type(4) { --node-accent: var(--ars-acid); }
    #ars-poster .ars-node:nth-of-type(5) { --node-accent: var(--purple); }

    #ars-poster .ars-node strong,
    #ars-poster .ars-node span {
      display: block;
    }

    #ars-poster .ars-node span {
      color: var(--muted-foreground);
    }

    #ars-poster .ars-chevron {
      color: var(--muted-foreground);
    }

    #ars-poster .ars-rule {
      align-self: stretch;
      display: grid;
      align-content: center;
      padding-left: 20px;
      border-left: 1px solid color-mix(in srgb, var(--ars-ink) 18%, transparent);
    }

    #ars-poster .ars-rule-mark {
      width: 44px;
      height: 6px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, var(--ars-mint) 0 48%, var(--ars-pink) 48% 76%, var(--ars-acid) 76%);
    }

    #ars-poster .ars-rule h3 {
      margin-bottom: 5px;
      font-size: calc(var(--font-size-base) * 1.45);
      line-height: 1.04;
    }

    #ars-poster .ars-rule p {
      margin-bottom: 0;
      color: var(--muted-foreground);
      line-height: 1.32;
    }

    @media (max-height: 780px) {
      #ars-poster {
        grid-template-rows: 104px minmax(0, 1fr) 144px;
        font-size: 14px;
      }

      #ars-poster .ars-top,
      #ars-poster .ars-stage,
      #ars-poster .ars-bottom {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      #ars-poster .ars-stage {
        grid-template-rows: auto 54px minmax(0, 1fr) auto;
      }

      #ars-poster .ars-copy {
        grid-template-columns: minmax(0, 1.45fr) minmax(110px, 0.55fr);
        gap: 12px;
        padding-top: 8px;
      }

      #ars-poster .ars-output {
        margin-top: 8px;
        padding-top: 8px;
      }

      #ars-poster .ars-list li + li {
        margin-top: 3px;
      }
    }

    @media (max-width: 1120px) {
      #ars-poster .ars-title {
        font-size: calc(var(--font-size-base) * 2.55);
      }

      #ars-poster .ars-stage {
        padding-left: 18px;
        padding-right: 18px;
      }

      #ars-poster .ars-copy {
        grid-template-columns: 1fr;
      }

      #ars-poster .ars-why {
        padding-left: 0;
        border-left: 0;
      }

      #ars-poster .ars-extra {
        display: none;
      }
    }
  &lt;/style&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

&lt;/script&gt;
