  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;ux-chart-loop&quot;&gt;
  &lt;style&gt;
    html,
    body {
      height: 100%;
      overflow: hidden !important;
    }

    body {
      padding: 0 !important;
    }

    #ux-chart-loop {
      --ucl-dark: color-mix(in oklab, var(--foreground) 92%, var(--purple));
      --ucl-light: var(--background);
      --ucl-ink: var(--foreground);
      --ucl-mint: var(--green);
      --ucl-pink: var(--viz-series-4);
      --ucl-acid: var(--yellow);
      --ucl-violet: var(--purple);
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-rows: minmax(118px, 16vh) minmax(0, 1fr) minmax(160px, 22vh);
      color: var(--ucl-ink);
      background:
        linear-gradient(color-mix(in srgb, var(--ucl-ink) 5%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--ucl-ink) 5%, transparent) 1px, transparent 1px),
        var(--ucl-light);
      background-size: 24px 24px;
      font-size: clamp(14px, 1.55vh, 17px);
      font-weight: 400;
    }

    #ux-chart-loop * {
      box-sizing: border-box;
    }

    #ux-chart-loop h1,
    #ux-chart-loop h2,
    #ux-chart-loop h3,
    #ux-chart-loop p,
    #ux-chart-loop ul {
      margin-top: 0;
    }

    #ux-chart-loop h1,
    #ux-chart-loop h2,
    #ux-chart-loop h3,
    #ux-chart-loop strong {
      font-weight: 500;
    }

    #ux-chart-loop .ucl-mono,
    #ux-chart-loop .ucl-kicker,
    #ux-chart-loop .ucl-label,
    #ux-chart-loop .ucl-step,
    #ux-chart-loop .ucl-output-label,
    #ux-chart-loop .ucl-loop-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #ux-chart-loop .ucl-top {
      position: relative;
      display: grid;
      grid-template-columns: minmax(560px, 1.2fr) minmax(300px, 0.7fr) minmax(330px, 0.72fr);
      gap: clamp(18px, 2vw, 38px);
      align-items: center;
      padding: 18px clamp(22px, 3.4vw, 64px) 16px;
      border-bottom: 1px solid color-mix(in srgb, var(--ucl-ink) 15%, transparent);
    }

    #ux-chart-loop .ucl-top::before {
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: linear-gradient(90deg, var(--ucl-mint) 0 28%, var(--ucl-pink) 28% 54%, var(--ucl-acid) 54% 80%, var(--ucl-violet) 80%);
      content: &quot;&quot;;
    }

    #ux-chart-loop .ucl-kicker {
      margin-bottom: 6px;
      color: var(--muted-foreground);
    }

    #ux-chart-loop .ucl-title {
      margin-bottom: 0;
      font-size: calc(var(--font-size-base) * 3.05);
      line-height: 0.94;
      letter-spacing: -0.045em;
    }

    #ux-chart-loop .ucl-title span {
      color: var(--ucl-mint);
    }

    #ux-chart-loop .ucl-thesis {
      align-self: stretch;
      display: grid;
      align-content: center;
      padding-left: 22px;
      border-left: 1px solid color-mix(in srgb, var(--ucl-ink) 20%, transparent);
    }

    #ux-chart-loop .ucl-thesis .ucl-label {
      margin-bottom: 4px;
      color: var(--ucl-pink);
    }

    #ux-chart-loop .ucl-thesis p {
      max-width: 440px;
      margin-bottom: 0;
      line-height: 1.28;
    }

    #ux-chart-loop .ucl-switch {
      align-self: center;
      display: inline-flex;
      width: 100%;
      min-height: 44px;
      align-items: center;
      gap: 11px;
      margin-bottom: 0;
      padding: 10px 14px;
      border: 1px solid color-mix(in srgb, var(--ucl-mint) 68%, rgb(19 33 29));
      border-radius: 4px;
      color: rgb(19 33 29);
      background: color-mix(in srgb, var(--ucl-mint) 82%, white);
      box-shadow: 7px 7px 0 color-mix(in srgb, var(--ucl-mint) 22%, transparent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: max(15px, 0.88em);
      font-weight: 700;
      letter-spacing: 0.055em;
      line-height: 1.1;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    #ux-chart-loop .ucl-switch::after {
      margin-left: auto;
      font-size: 1.3em;
      content: &quot;→&quot;;
    }

    #ux-chart-loop .ucl-switch i {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
    }

    #ux-chart-loop .ucl-switch:hover {
      box-shadow: 9px 9px 0 color-mix(in srgb, var(--ucl-mint) 28%, transparent);
      transform: translateY(-2px);
    }

    #ux-chart-loop .ucl-switch:focus-visible {
      outline: 3px solid var(--ucl-pink);
      outline-offset: 3px;
    }

    #ux-chart-loop .ucl-flow {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      color: var(--ucl-light);
      background:
        radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ucl-light) 15%, transparent) 1px, transparent 1.5px),
        var(--ucl-dark);
      background-size: 24px 24px;
      border-bottom: 7px solid var(--ucl-mint);
    }

    #ux-chart-loop .ucl-stage {
      --stage-accent: var(--ucl-mint);
      position: relative;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(74px, 12vh) minmax(0, 1fr) auto;
      padding: clamp(17px, 2.2vh, 26px) clamp(17px, 1.8vw, 34px) clamp(14px, 1.9vh, 22px);
      border-right: 1px solid color-mix(in srgb, var(--ucl-light) 18%, transparent);
    }

    #ux-chart-loop .ucl-stage:nth-child(2) { --stage-accent: var(--ucl-pink); }
    #ux-chart-loop .ucl-stage:nth-child(3) { --stage-accent: var(--ucl-acid); }
    #ux-chart-loop .ucl-stage:nth-child(4) {
      --stage-accent: var(--ucl-violet);
      border-right: 0;
    }

    #ux-chart-loop .ucl-stage::before {
      position: absolute;
      inset: 0 auto auto 0;
      width: 42%;
      height: 4px;
      background: var(--stage-accent);
      content: &quot;&quot;;
    }

    #ux-chart-loop .ucl-stage::after {
      position: absolute;
      top: 50%;
      right: -10px;
      z-index: 2;
      width: 19px;
      height: 19px;
      border-top: 1px solid color-mix(in srgb, var(--ucl-light) 54%, transparent);
      border-right: 1px solid color-mix(in srgb, var(--ucl-light) 54%, transparent);
      background: var(--ucl-dark);
      content: &quot;&quot;;
      transform: rotate(45deg);
    }

    #ux-chart-loop .ucl-stage:last-child::after {
      display: none;
    }

    #ux-chart-loop .ucl-stage-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 11px;
      align-items: start;
    }

    #ux-chart-loop .ucl-step {
      color: var(--stage-accent);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    #ux-chart-loop .ucl-stage h2 {
      margin-bottom: 3px;
      color: var(--ucl-light);
      font-size: calc(var(--font-size-base) * 1.62);
      line-height: 1;
      letter-spacing: -0.025em;
    }

    #ux-chart-loop .ucl-skill-name {
      margin-bottom: 4px;
      color: var(--stage-accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    #ux-chart-loop .ucl-skill-name a {
      color: inherit;
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    #ux-chart-loop .ucl-skill-name strong {
      font-weight: 700;
    }

    #ux-chart-loop .ucl-stage-sub {
      margin-bottom: 0;
      color: color-mix(in srgb, var(--ucl-light) 62%, transparent);
    }

    #ux-chart-loop .ucl-schematic {
      width: 100%;
      height: 100%;
      min-height: 66px;
      color: var(--stage-accent);
    }

    #ux-chart-loop .ucl-schematic .ucl-faint {
      color: color-mix(in srgb, var(--ucl-light) 30%, transparent);
    }

    #ux-chart-loop .ucl-copy {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(105px, 0.72fr);
      gap: clamp(12px, 1.3vw, 22px);
      padding-top: 11px;
      border-top: 1px solid color-mix(in srgb, var(--ucl-light) 16%, transparent);
    }

    #ux-chart-loop .ucl-label {
      margin-bottom: 7px;
      color: var(--stage-accent);
    }

    #ux-chart-loop .ucl-list {
      margin-bottom: 0;
      padding-left: 15px;
      line-height: 1.31;
    }

    #ux-chart-loop .ucl-list li + li {
      margin-top: 6px;
    }

    #ux-chart-loop .ucl-why {
      padding-left: 12px;
      border-left: 1px solid color-mix(in srgb, var(--ucl-light) 22%, transparent);
      line-height: 1.31;
    }

    #ux-chart-loop .ucl-why p {
      margin-bottom: 0;
    }

    #ux-chart-loop .ucl-output {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid color-mix(in srgb, var(--ucl-light) 16%, transparent);
    }

    #ux-chart-loop .ucl-output i {
      color: var(--stage-accent);
    }

    #ux-chart-loop .ucl-output-label {
      color: var(--stage-accent);
    }

    #ux-chart-loop .ucl-output p {
      margin-bottom: 0;
      color: color-mix(in srgb, var(--ucl-light) 68%, transparent);
    }

    #ux-chart-loop .ucl-bottom {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(300px, 0.62fr);
      gap: clamp(24px, 3vw, 54px);
      align-items: center;
      padding: 14px clamp(22px, 3.4vw, 64px);
    }

    #ux-chart-loop .ucl-loop-label {
      margin-bottom: 8px;
      color: var(--muted-foreground);
    }

    #ux-chart-loop .ucl-return {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid color-mix(in srgb, var(--ucl-ink) 18%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--ucl-ink) 18%, transparent);
    }

    #ux-chart-loop .ucl-return::before {
      position: absolute;
      inset: -1px auto auto 0;
      width: 24%;
      height: 3px;
      background: var(--ucl-violet);
      content: &quot;&quot;;
    }

    #ux-chart-loop .ucl-return-icon {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--ucl-violet);
      border-radius: 50%;
      color: var(--ucl-violet);
    }

    #ux-chart-loop .ucl-return p {
      margin-bottom: 0;
    }

    #ux-chart-loop .ucl-return-path {
      color: var(--muted-foreground);
      text-align: right;
    }

    #ux-chart-loop .ucl-learning {
      align-self: stretch;
      display: grid;
      align-content: center;
      padding-left: 20px;
      border-left: 1px solid color-mix(in srgb, var(--ucl-ink) 18%, transparent);
    }

    #ux-chart-loop .ucl-learning-mark {
      width: 48px;
      height: 6px;
      margin-bottom: 9px;
      background: linear-gradient(90deg, var(--ucl-mint) 0 36%, var(--ucl-pink) 36% 68%, var(--ucl-acid) 68%);
    }

    #ux-chart-loop .ucl-learning h3 {
      margin-bottom: 5px;
      font-size: calc(var(--font-size-base) * 1.4);
      line-height: 1.04;
    }

    #ux-chart-loop .ucl-learning p {
      margin-bottom: 0;
      color: var(--muted-foreground);
      line-height: 1.32;
    }

    @media (max-height: 780px) {
      #ux-chart-loop {
        grid-template-rows: 126px minmax(0, 1fr) 146px;
        font-size: 14px;
      }

      #ux-chart-loop .ucl-top,
      #ux-chart-loop .ucl-stage,
      #ux-chart-loop .ucl-bottom {
        padding-top: 9px;
        padding-bottom: 9px;
      }

      #ux-chart-loop .ucl-top {
        grid-template-columns: minmax(0, 1.65fr) minmax(300px, 0.72fr);
      }

      #ux-chart-loop .ucl-switch {
        min-height: 36px;
        margin-bottom: 0;
        padding: 7px 10px;
        font-size: 14px;
        box-shadow: 4px 4px 0 color-mix(in srgb, var(--ucl-mint) 22%, transparent);
      }

      #ux-chart-loop .ucl-thesis {
        display: none;
      }

      #ux-chart-loop .ucl-stage {
        grid-template-rows: auto 28px minmax(0, 1fr) auto;
        padding-top: 7px;
        padding-bottom: 7px;
      }

      #ux-chart-loop .ucl-copy {
        grid-template-columns: minmax(0, 1.35fr) minmax(88px, 0.55fr);
        gap: 10px;
        padding-top: 8px;
      }

      #ux-chart-loop .ucl-list,
      #ux-chart-loop .ucl-why {
        line-height: 1.24;
      }

      #ux-chart-loop .ucl-output {
        margin-top: 7px;
        padding-top: 7px;
      }

      #ux-chart-loop .ucl-list li + li {
        margin-top: 3px;
      }

      #ux-chart-loop .ucl-extra {
        display: none;
      }
    }

    @media (max-width: 1500px) {
      #ux-chart-loop .ucl-top {
        grid-template-columns: minmax(0, 1.65fr) minmax(300px, 0.72fr);
      }

      #ux-chart-loop .ucl-thesis {
        display: none;
      }
    }

    @media (max-width: 1220px) {
      #ux-chart-loop .ucl-title {
        font-size: calc(var(--font-size-base) * 2.45);
      }

      #ux-chart-loop .ucl-stage {
        padding-left: 14px;
        padding-right: 14px;
      }

      #ux-chart-loop .ucl-copy {
        grid-template-columns: 1fr;
      }

      #ux-chart-loop .ucl-why {
        padding-left: 0;
        border-left: 0;
      }

      #ux-chart-loop .ucl-extra {
        display: none;
      }
    }

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
